name: 功能建议
description: 新增题库、示例、评级标准或规则改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        涉及两条硬约束（**显式触发**、**最多 8 问**）的改动，请先开 Issue 讨论，不要直接提 PR。
        只有一句「希望更智能」的建议很难被采纳，请给出具体场景与可复制的提示词。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述一个真实场景，说明现有 Skill 在哪里卡住了。
      placeholder: 例如：做数据管道需求时，Agent 从不问「失败重试由谁负责」，导致清单缺项。
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 题库（新增领域或决策点）
        - 示例（完整对话记录）
        - 评级校准（贴合度或筛选标准）
        - 措辞与规则
        - 文档与链接
        - 工具链 / CI
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 尽量给出可直接复制的提示词、选项或模板片段。
    validations:
      required: true

  - type: textarea
    id: conflict
    attributes:
      label: 与现有规则的关系
      description: 会不会与铁律冲突？会不会让某个决策点变成「一次多问」？
      placeholder: 不冲突；新增问题仍保持一次一问，选项数为 4 且含「其他（请说明）」。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认没有把「一次多问」或「省略其他选项」当作示范写进内容
          required: true
        - label: 我确认内容不含他人的隐私或未公开代码
          required: true
